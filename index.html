<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Speakform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F7F9;--surface:#FFFFFF;--ink:#14171F;--muted:#6B7280;--line:#E3E6EB;
  --accent:#2F5BFF;--accent-ink:#FFFFFF;--accent-soft:#E8EDFF;--ok:#12805C;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0E1015;--surface:#171A21;--ink:#F2F4F8;--muted:#9AA1AE;--line:#262A33;--accent:#7C95FF;--accent-ink:#0E1015;--accent-soft:#1D2440;--ok:#4FD1A1}
}
:root[data-theme="dark"]{--bg:#0E1015;--surface:#171A21;--ink:#F2F4F8;--muted:#9AA1AE;--line:#262A33;--accent:#7C95FF;--accent-ink:#0E1015;--accent-soft:#1D2440;--ok:#4FD1A1}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:10px}
#app{min-height:100vh;min-height:100dvh;max-width:640px;margin:0 auto;display:flex;flex-direction:column;padding:20px 24px 28px}
.top{display:flex;align-items:center;gap:14px;min-height:32px}
.bar{flex:1;height:4px;border-radius:4px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px;transition:width .4s ease}
.count{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.icon-btn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.icon-btn:hover{background:var(--line)}
.pill{display:flex;align-items:center;gap:6px;height:36px;padding:0 12px 0 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:500;color:var(--ink);white-space:nowrap}
.pill:hover{border-color:var(--muted)}
.pill[aria-pressed="false"]{color:var(--muted);background:transparent}
svg{display:block}
.stage{flex:1;display:flex;flex-direction:column;justify-content:center;gap:28px;padding:24px 0}
.q{font-size:clamp(28px,6.5vw,40px);line-height:1.15;font-weight:500;letter-spacing:-.02em;margin:0;text-wrap:balance}
.hint{color:var(--muted);font-size:15px;margin:-14px 0 0}
.live{min-height:56px;font-size:19px;line-height:1.4;color:var(--muted)}
.live b{color:var(--ink);font-weight:500}
.live .caret{display:inline-block;width:2px;height:1.1em;background:var(--accent);vertical-align:text-bottom;margin-left:2px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.field{width:100%;font:inherit;font-size:22px;padding:14px 0;border:0;border-bottom:2px solid var(--line);background:transparent;color:var(--ink);border-radius:0}
.field:focus{outline:none;border-color:var(--accent)}
textarea.field{resize:none;min-height:96px;line-height:1.4}
.chips{display:flex;flex-direction:column;gap:10px}
.chip{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);font-size:18px;text-align:left}
.chip small{color:var(--muted);font-size:14px}
.chip:hover{border-color:var(--muted)}
.chip[aria-checked="true"]{border-color:var(--accent);background:var(--accent-soft)}
.confirm{background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.confirm .got{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:500}
.confirm .got svg{color:var(--ok);flex:none}
.confirm .row{display:flex;gap:8px;align-items:center}
.ghost{padding:9px 14px;border-radius:999px;font-size:14px;color:var(--muted);border:1px solid var(--line)}
.ghost:hover{color:var(--ink);border-color:var(--muted)}
.timer{height:3px;border-radius:3px;background:var(--line);overflow:hidden}
.timer i{display:block;height:100%;width:100%;background:var(--ok);transform-origin:left;animation:drain 3s linear forwards}
.confirm.paused .timer i{animation-play-state:paused}
@keyframes drain{to{transform:scaleX(0)}}
.dock{display:flex;flex-direction:column;align-items:center;gap:18px;padding-top:8px}
.mic{position:relative;width:88px;height:88px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;transition:transform .15s}
.mic:active{transform:scale(.95)}
.mic.idle{background:var(--surface);color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
.mic.listening::before,.mic.listening::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--accent);animation:ring 1.6s ease-out infinite}
.mic.listening::after{animation-delay:.8s}
@keyframes ring{from{transform:scale(1);opacity:.7}to{transform:scale(1.7);opacity:0}}
.mic.processing{background:linear-gradient(100deg,var(--accent) 30%,var(--accent-soft) 50%,var(--accent) 70%);background-size:250% 100%;animation:shim 1.1s linear infinite}
@keyframes shim{to{background-position:-250% 0}}
.wave{display:flex;gap:4px;align-items:center;height:28px}
.wave i{width:4px;height:6px;border-radius:3px;background:currentColor;animation:bar 0.9s ease-in-out infinite}
.wave i:nth-child(2){animation-delay:.12s}.wave i:nth-child(3){animation-delay:.24s}.wave i:nth-child(4){animation-delay:.36s}.wave i:nth-child(5){animation-delay:.48s}
@keyframes bar{50%{height:26px}}
.status{font-size:14px;color:var(--muted);height:20px}
.tools{display:flex;gap:4px;justify-content:center;flex-wrap:wrap}
.tool{display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:999px;font-size:14px;color:var(--muted)}
.tool:hover{background:var(--line);color:var(--ink)}
.tool:disabled{opacity:.35;cursor:default;background:none}
.primary{width:100%;padding:16px;border-radius:14px;background:var(--accent);color:var(--accent-ink);font-size:17px;font-weight:600}
.primary:disabled{opacity:.4;cursor:default}
.center{align-items:flex-start}
.note{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--muted);line-height:1.45}
.note svg{flex:none;margin-top:2px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg button{padding:18px 12px;border:1.5px solid var(--line);border-radius:16px;background:var(--surface);display:flex;flex-direction:column;align-items:center;gap:8px;font-size:16px;font-weight:500}
.seg button:hover{border-color:var(--accent)}
.seg small{font-weight:400;color:var(--muted);font-size:13px}
.review{display:flex;flex-direction:column}
.review li{list-style:none;display:flex;justify-content:space-between;gap:16px;align-items:baseline;padding:14px 0;border-bottom:1px solid var(--line)}
.review ul{margin:0;padding:0}
.review span{color:var(--muted);font-size:14px}
.review p{margin:2px 0 0;font-size:18px}
.done{align-items:center;text-align:center}
.tick{width:72px;height:72px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<form name="responses" method="POST" data-netlify="true" hidden><input name="answers"><input name="submitted"></form>
<div class="sr" aria-live="polite" id="live"></div>
<script>
const I={
  mic:'<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>',
  micS:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>',
  kb:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="6" width="19" height="12" rx="2.5"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"/></svg>',
  check:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m8 12.5 2.8 2.8L16 9.5"/></svg>',
  back:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"/></svg>',
  repeat:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 0 1 14-5.3L20 9M20 4v5h-5M20 12a8 8 0 0 1-14 5.3L4 15M4 20v-5h5"/></svg>',
  skip:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7"/></svg>',
  spk:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5zM16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/></svg>',
  lock:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>'
};
I.spkOff='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5zM16.5 9.5l5 5M21.5 9.5l-5 5"/></svg>';
const Q=[
  {id:'name',q:'What’s your full name?',type:'name',demo:['My name is Aarav Mehta','Aarav Mehta']},
  {id:'dob',q:'What’s your date of birth?',type:'text',hint:'Say it any way you like.',demo:['twelfth March ninety eight','12 March 1998']},
  {id:'phone',q:'What’s the best phone number to reach you?',type:'phone',demo:['nine eight seven six five, four three two one zero','+91 98765 43210']},
  {id:'plan',q:'Which plan fits you best?',type:'choice',opts:[['Basic','Free'],['Plus','₹199 a month'],['Pro','₹499 a month']],demo:['the middle one, no wait, yes, the middle one','Plus']},
  {id:'note',q:'Anything else you’d like us to know?',type:'long',hint:'Take your time. Tap done when you finish.',demo:['it would be great to have Gujarati and a dark mode','It would be great to have Gujarati and a dark mode.']}
];
const S={screen:'intro',i:0,mode:'voice',mic:'idle',ans:{},pending:null,tts:true,fromReview:false};
let timers=[];
const $=s=>document.querySelector(s);
const app=$('#app');
function clr(){stopRec();timers.forEach(t=>{clearTimeout(t);clearInterval(t)});timers=[]}
function say(t){
  const el=$('#live');if(el)el.textContent=t;
  if(!S.tts||S.mode!=='voice')return;
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.rate=1;speechSynthesis.speak(u)}catch(e){}
}
function hush(){try{speechSynthesis.cancel()}catch(e){}}
function ttsInner(){return S.tts?I.spk+'<span>Voice on</span>':I.spkOff+'<span>Muted</span>'}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

function topbar(){
  const n=Q.length,pct=S.screen==='intro'?0:S.screen==='question'?(S.i/n*100):100;
  return `<div class="top">
    <div class="bar" role="progressbar" aria-valuenow="${Math.round(pct)}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div>
    <span class="count">${S.screen==='question'?(S.i+1)+' of '+n:S.screen==='review'?'Review':''}</span>
    <button class="pill" data-act="tts" aria-pressed="${S.tts}" aria-label="Read questions aloud">${ttsInner()}</button>
  </div>`;
}

function intro(){
  return topbar()+`<div class="stage">
    <h1 class="q">Fill this form by speaking, typing, or both.</h1>
    <p class="hint" style="margin-top:-8px">Volunteer sign-up · 5 questions · about 2 minutes</p>
    <div class="seg">
      <button data-act="start" data-mode="voice">${I.micS.replace('width="18" height="18"','width="26" height="26"')}Speak<small>Questions are read aloud</small></button>
      <button data-act="start" data-mode="type">${I.kb.replace('width="18" height="18"','width="26" height="26"')}Type<small>Quiet and private</small></button>
    </div>
    <div class="note">${I.lock}<span>Your voice is turned into text on this device’s browser and is not saved. You can switch between speaking and typing at any time.</span></div>
  </div>`;
}

function question(){
  const q=Q[S.i],v=S.ans[q.id]||'';
  let body='',dock='';
  if(q.type==='choice'){
    body=`<div class="chips" role="radiogroup" aria-label="${esc(q.q)}">${q.opts.map(o=>`<button class="chip" role="radio" aria-checked="${v===o[0]}" data-act="pick" data-v="${o[0]}"><span>${o[0]}</span><small>${o[1]}</small></button>`).join('')}</div>`;
  }
  if(S.mode==='type'){
    if(q.type!=='choice') body=q.type==='long'
      ?`<textarea class="field" id="inp" rows="3" placeholder="Type your answer" aria-label="${esc(q.q)}">${esc(v)}</textarea>`
      :`<input class="field" id="inp" value="${esc(v)}" placeholder="Type your answer" aria-label="${esc(q.q)}" autocomplete="off">`;
    dock=`<button class="primary" data-act="next" ${q.type==='choice'&&!v?'disabled':''}>${S.i===Q.length-1?'Review answers':'Next'}</button>`;
  }else{
    const m=S.mic;
    if(m==='confirm'){
      body=`<div class="confirm" id="cf"><div class="got">${I.check}<span>${esc(S.pending)}</span></div>
        ${S.follow?`<p class="hint" style="margin:0">${esc(S.follow)}</p>`:'<div class="timer"><i></i></div>'}
        <div class="row"><button class="ghost" data-act="accept">Looks right</button><button class="ghost" data-act="edit">Edit</button><button class="ghost" data-act="resay">Say again</button></div></div>`;
    }else if(q.type!=='choice'){
      body=`<div class="live" id="tr">${m==='idle'?(v?`<b>${esc(v)}</b>`:'Tap the mic and start talking.'):''}</div>`;
    }else if(m==='listening'||m==='processing'){
      body+=`<div class="live" id="tr"></div>`;
    }
    const label={idle:'Tap to speak',listening:q.type==='long'?'Listening. Tap when done':'Listening',processing:'Understanding…',confirm:''}[m];
    dock=m==='confirm'?'':`<div class="status" id="st">${label}</div>
      <button class="mic ${m}" data-act="mic" aria-label="${m==='listening'?'Stop listening':'Start speaking'}">${m==='listening'?'<span class="wave"><i></i><i></i><i></i><i></i><i></i></span>':I.mic}</button>`;
  }
  const tools=`<div class="tools">
    <button class="tool" data-act="back" ${S.i===0?'disabled':''}>${I.back}Back</button>
    <button class="tool" data-act="repeat">${I.repeat}Repeat</button>
    <button class="tool" data-act="skip">${I.skip}Skip</button>
    <button class="tool" data-act="toggle">${S.mode==='voice'?I.kb+'Type instead':I.micS+'Speak instead'}</button></div>`;
  return topbar()+`<div class="stage"><h2 class="q">${esc(q.q)}</h2>${q.hint?`<p class="hint">${esc(q.hint)}</p>`:''}${body}</div>
    <div class="dock">${dock}${tools}</div>`;
}

function review(){
  return topbar()+`<div class="stage"><h2 class="q">Check your answers</h2>
    <div class="review"><ul>${Q.map((q,k)=>`<li><div><span>${esc(q.q)}</span><p>${esc(S.ans[q.id]||'Skipped')}</p></div><button class="ghost" data-act="editq" data-k="${k}">Edit</button></li>`).join('')}</ul></div></div>
    <div class="dock"><button class="primary" data-act="submit">Submit</button></div>`;
}

function done(){
  return topbar()+`<div class="stage done"><div class="tick">${I.check.replace('width="22" height="22"','width="36" height="36"')}</div>
    <h2 class="q">Thanks, you’re all set.</h2><p class="hint" style="margin-top:-8px">Your answers have been submitted.</p>
    <button class="ghost" data-act="restart">Try it again</button></div>`;
}

function render(){
  app.innerHTML=S.screen==='intro'?intro():S.screen==='question'?question():S.screen==='review'?review():done();
  const inp=$('#inp');if(inp&&S.mode==='type'){inp.focus();inp.setSelectionRange(inp.value.length,inp.value.length)}
  if(S.screen==='question'&&S.mic==='confirm'){
    const cf=$('#cf');
    ['pointerdown','focusin'].forEach(e=>cf.addEventListener(e,()=>{clr();cf.classList.add('paused')}));
    if(!S.follow)timers.push(setTimeout(accept,3100));
  }
}

function ask(){S.follow=null;S.mic='idle';S.pending=null;clr();render();say(Q[S.i].q)}
function go(i){S.i=i;if(i>=Q.length){S.screen='review';hush();clr();render();say('Here’s a quick review of your answers.')}else ask()}
function accept(){const q=Q[S.i];S.ans[q.id]=S.pending;clr();S.mic='idle';if(S.fromReview){S.fromReview=false;S.screen='review';render()}else go(S.i+1)}

const API='/api/parse';
const LANG='en-IN'; // speech language: en-IN, hi-IN, gu-IN ...
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec=null;
function stopRec(){try{rec&&rec.abort()}catch(e){}rec=null}
function setStatus(t){const x=$('#st');if(x)x.textContent=t}
function listen(){
  clr();hush();S.follow=null;
  if(!SR){S.mode='type';S.mic='idle';render();return}
  const q=Q[S.i];let text='';
  rec=new SR();rec.lang=LANG;rec.interimResults=true;rec.continuous=q.type==='long';
  S.mic='listening';render();
  rec.onresult=e=>{text='';for(const r of e.results)text+=r[0].transcript;const tr=$('#tr');if(tr)tr.innerHTML='<b>'+esc(text)+'</b><span class="caret"></span>'};
  rec.onerror=e=>{rec=null;S.mic='idle';render();setStatus(e.error==='not-allowed'?'Mic is blocked. Allow it in your browser or type instead.':'Didn’t catch that. Tap to try again.')};
  rec.onend=()=>{if(!rec)return;rec=null;finish(text)};
  try{rec.start()}catch(e){rec=null;S.mic='idle';render()}
}
// Plain-code cleanup for things that don't need an LLM (instant, free, works offline)
const NUM={zero:0,oh:0,one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9};
const MULT={double:2,triple:3};
const has=(o,k)=>Object.prototype.hasOwnProperty.call(o,k);
function digitsFrom(t){
  let out='',m=1;
  for(const x of t.toLowerCase().replace(/[^a-z0-9+ ]/g,' ').split(/\s+/)){
    if(has(MULT,x)){m=MULT[x];continue}
    if(x==='plus'){out+='+';continue}
    const d=/^\+?\d+$/.test(x)?x:(has(NUM,x)?String(NUM[x]):null);
    if(d!==null){out+=d.repeat(m);m=1}
  }
  return out;
}
function local(q,text){
  if(q.type==='phone'){
    const d=digitsFrom(text),n=d.replace(/\D/g,'').length;
    if(n>=10)return{value:d,needs_confirm:false};
    if(n>0)return{value:d,needs_confirm:true,follow_up:'I only caught '+n+' digits. Say the number again, or tap Edit.'};
    return null;
  }
  if(q.type==='name'){
    const v=text.replace(/^\s*(my name is|my name['’]s|i am|i['’]m|this is|it['’]s|it is)\s+/i,'').replace(/[.,]+$/,'').trim();
    return v?{value:v.replace(/(^|\s)\p{L}/gu,c=>c.toUpperCase()),needs_confirm:false}:null;
  }
  if(q.type==='choice'){
    const t=text.toLowerCase(),o=q.opts.map(x=>x[0]);
    const hit=o.filter(x=>t.includes(x.toLowerCase()));
    if(hit.length===1)return{value:hit[0],needs_confirm:false};
    const ord=[[/\b(first|1st)\b/,0],[/\b(second|2nd)\b/,1],[/\bmiddle\b/,Math.floor(o.length/2)],[/\b(third|3rd)\b/,2],[/\blast\b/,o.length-1]].filter(x=>x[0].test(t));
    if(ord.length===1&&o[ord[0][1]])return{value:o[ord[0][1]],needs_confirm:false};
  }
  return null;
}
async function finish(text){
  text=text.trim();const q=Q[S.i];
  if(!text){S.mic='idle';render();setStatus('Didn’t catch that. Tap to try again.');return}
  const t=text.toLowerCase(),short=t.split(/\s+/).length<=4;
  if(short&&/\b(go back|previous)\b/.test(t)&&S.i>0){go(S.i-1);return}
  if(short&&/\bskip\b/.test(t)){S.ans[q.id]='';go(S.i+1);return}
  if(short&&/\b(repeat|say that again|say it again)\b/.test(t)){S.mic='idle';render();say(q.q);return}
  S.mic='processing';render();const tr=$('#tr');if(tr)tr.innerHTML='<b>'+esc(text)+'</b>';
  let r=local(q,text);
  if(!r||q.type==='name'){
    try{
      const res=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:q.q,type:q.type,options:q.opts?q.opts.map(o=>o[0]):null,transcript:text})});
      const j=await res.json();if(!res.ok)throw new Error(j.error||('HTTP '+res.status));
      r=j;
    }catch(e){
      console.warn('Smart parse unavailable:',e.message);
      if(!r){
        if(q.type==='choice'){S.mic='idle';render();setStatus('Didn’t match an option. Tap one or try again.');return}
        r={value:text,needs_confirm:false};
      }
    }
  }
  S.pending=r.value||text;S.follow=r.needs_confirm&&r.follow_up?r.follow_up:null;
  S.mic='confirm';render();say(S.follow||('Got it. '+S.pending));
}
async function submit(b){
  b.disabled=true;b.textContent='Submitting…';
  try{
    const body=new URLSearchParams({'form-name':'responses',answers:JSON.stringify(S.ans),submitted:new Date().toISOString()});
    const res=await fetch('/',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body});
    if(!res.ok)throw new Error(res.status);
    S.screen='done';hush();render();
  }catch(e){console.warn('Submit failed:',e.message);b.disabled=false;b.textContent='Couldn’t submit ('+e.message+'). Tap to retry'}
}

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,q=Q[S.i];
  if(a==='tts'){S.tts=!S.tts;if(!S.tts)hush();b.setAttribute('aria-pressed',S.tts);b.innerHTML=ttsInner();if(S.tts&&S.screen==='question')say(q.q)}
  else if(a==='start'){S.mode=b.dataset.mode;S.screen='question';S.i=0;ask()}
  else if(a==='mic'){S.mic==='listening'&&rec?rec.stop():listen()}
  else if(a==='accept'){accept()}
  else if(a==='edit'){clr();S.ans[q.id]=S.pending;S.mode='type';S.mic='idle';render()}
  else if(a==='resay'){listen()}
  else if(a==='pick'){S.ans[q.id]=b.dataset.v;if(S.mode==='voice'){S.mic='idle';clr();hush();go(S.i+1)}else render()}
  else if(a==='next'){const inp=$('#inp');if(inp)S.ans[q.id]=inp.value.trim();if(S.fromReview){S.fromReview=false;S.screen='review';render()}else go(S.i+1)}
  else if(a==='back'&&S.i>0){go(S.i-1)}
  else if(a==='repeat'){say(q.q)}
  else if(a==='skip'){S.ans[q.id]='';go(S.i+1)}
  else if(a==='toggle'){clr();hush();S.mode=S.mode==='voice'?'type':'voice';S.mic='idle';render();if(S.mode==='voice')say(q.q)}
  else if(a==='editq'){S.i=+b.dataset.k;S.screen='question';S.mode='type';S.fromReview=true;S.mic='idle';render()}
  else if(a==='submit'){submit(b)}
  else if(a==='restart'){S.screen='intro';S.ans={};S.i=0;S.mode='voice';render()}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!e.shiftKey&&e.target.id==='inp'&&e.target.tagName==='INPUT'){e.preventDefault();document.querySelector('[data-act="next"]')?.click()}
});
render();
</script>
